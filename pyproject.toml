[project]
name = "marine-sr"
version = "0.1.0"
description = "Marine Parameter Super-Resolution Deep Learning Project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "tqdm",
    "wandb",
    "pyyaml",
    "scipy",
    "einops",
    "timm",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
all = [
    "fairscale",        # ATD 模型需要
    "basicsr",          # CAMixer 模型需要
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
[project]
name = "marine-sr"
version = "0.1.0"
description = "Marine Parameter Super-Resolution Deep Learning Project"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "tqdm",
    "wandb",
    "pyyaml",
    "scipy",
    "einops",
    "timm",
    "fairscale",
    "pytest",
    "ruff",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.0",
    "torchvision",
]
cu128 = [
    "torch>=2.0",
    "torchvision",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
